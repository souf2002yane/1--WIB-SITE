<style>

 .calculator { background: #597484; width: 400px; border-radius: 20px; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
  .display { background: #2a3942; color: white; font-size: 50px; text-align: left; padding: 20px; border-radius: 12px; min-height: 80px; overflow: hidden; direction: ltr; }
  .buttons { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-top: 20px; }
  button { height: 65px; border: none; border-radius: 30%; font-size: 25px; cursor: pointer; background: #2a3942; color: white; transition: 0.2s; }
  button:active { transform: scale(0.95); }
  button.op { background: rgb(140, 43, 8); }
  button.clear { background: #f15c6d; }
  button.equal { background:blue; grid-column: span 4; border-radius: 30px; }
  button.zero { grid-column: span 1.5; border-radius: 30px; }
</style>

<h1 align="center">Calculator</h1>
<div class="calculator" id="calculator">
  <div class="display" id="display">0</div>
  <div class="buttons">
    <button class="clear" onclick="clearAll()">C</button>
    <button onclick="del()">⌫</button>
    <button class="op" onclick="append('%')">%</button>
    <button class="op" onclick="append('/')">÷</button>

    <button onclick="append('7')">7</button>
    <button onclick="append('8')">8</button>
    <button onclick="append('9')">9</button>
    <button class="op" onclick="append('*')">×</button>

    <button onclick="append('4')">4</button>
    <button onclick="append('5')">5</button>
    <button onclick="append('6')">6</button>
    <button class="op" onclick="append('-')">−</button>

    <button onclick="append('1')">1</button>
    <button onclick="append('2')">2</button>
    <button onclick="append('3')">3</button>
    <button class="op" onclick="append('+')">+</button>

    <button class="zero" onclick="append('0')">0</button>
     <button class="zero" onclick="append('00')">00</button>
    <button onclick="append('.')">.</button>
    <button class="equal" onclick="calculate()">=</button>
  </div>

</div>



 <script src="javascript"></script>
</body>
